[workspace]
    members=["crates/rivet-cli", "crates/rivet-core", "crates/rivet-package", "crates/rivet-repository", "crates/rivet-resolver", "crates/rivet-tui"]

    resolver="3"

    [workspace.package]
        authors=["Frank1o3"]
        edition="2024"
        license="BSD-3-Clause"
        repository="https://github.com/Frank1o3/rivet.git"
        version="0.2.1"

    [workspace.dependencies]
        rivet-cli={path="crates/rivet-cli"}
        rivet-core={path="crates/rivet-core"}
        rivet-package={path="crates/rivet-package"}
        rivet-repository={path="crates/rivet-repository"}
        rivet-resolver={path="crates/rivet-resolver"}

        anyhow="1.0"
        bzip2="0.6"
        dirs="6.0.0"
        flate2="1.1.9"
        hex="0.4.3"
        libc="0.2.189"
        mlua={version="0.12.1", features=["lua54", "vendored"]}
        reqwest={version="0.13.4", features=["blocking", "brotli", "deflate", "gzip", "rustls", "zstd"]}
        semver={version="1.0", features=["serde"]}
        serde={version="1.0", features=["derive"]}
        serde_json="1.0"
        sha2="0.11.0"
        tar="0.4.46"
        tempfile="3.17"
        thiserror="2.0"
        walkdir="2.5"
        xz2="0.1.7"
        zip="8.6.0"
